<style>

*{margin:0;padding:0;box-sizing:border-box}body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
.hdr{background:linear-gradient(135deg,var(--r),var(--rd));padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.12)}

.uz{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 56px);padding:32px;animation:fi .5s}
@keyframes fi{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.ub{border:2px dashed var(--b2);border-radius:18px;padding:48px;text-align:center;cursor:pointer;transition:all .3s;background:var(--c);max-width:540px;width:100%}
.ub:hover,.ub.dg{border-color:var(--r);background:var(--h);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.08)}
.ub .ic{font-size:46px;display:block;margin-bottom:10px}.ub .tt{font-size:18px;font-weight:700;margin-bottom:4px}.ub .st{color:var(--td);font-size:12px;margin-bottom:16px}

.SS{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}

.FR{background:none;border:1px solid var(--bd);color:var(--td);padding:6px 10px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:11px}.FR:hover{border-color:var(--r);color:var(--r)}
/* Multi-select */
.ms-wrap{position:relative}.ms-btn{background:var(--c);border:1px solid var(--bd);color:var(--t);padding:6px 8px;border-radius:6px;font-size:11px;min-width:120px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}.ms-btn.open{border-color:var(--r)}.ms-btn.active{background:#FFF3E0;border-color:#E65100;color:#E65100;font-weight:600}.ms-btn .ms-cnt{background:#E65100;color:#fff;border-radius:10px;padding:0 6px;font-size:9px;font-weight:700;margin-left:auto}.ms-btn.active::after{content:'\u25be';margin-left:4px;font-size:10px}
.ms-dd{display:none;position:absolute;top:100%;left:0;min-width:200px;max-height:280px;overflow-y:auto;background:var(--c);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:50;margin-top:2px;padding:4px}.ms-dd.show{display:block}
.ms-opt{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:11px;cursor:pointer;border-radius:4px}.ms-opt:hover{background:var(--h)}.ms-opt.sel{background:#E3F2FD;color:var(--bl);font-weight:600}.ms-opt.dis{opacity:.38;cursor:not-allowed}.ms-opt.dis:hover{background:transparent}.ms-opt .cnt{margin-left:auto;color:var(--tm);font-size:9px;font-family:'JetBrains Mono',monospace}

.DG{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:14px}
.DC{background:var(--c);border:1px solid var(--bd);border-radius:9px;padding:12px 14px;border-left:4px solid var(--g);box-shadow:0 1px 3px rgba(0,0,0,.04)}

.TW{overflow:auto}.DT{width:100%;border-collapse:collapse;font-size:11px;table-layout:auto}.DT thead{position:sticky;top:0;z-index:5}
.DT th{background:var(--e);padding:8px 10px;text-align:left;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--tm);white-space:nowrap;border-bottom:1px solid var(--bd);cursor:pointer;vertical-align:middle}

.DT th.srt-a,.DT th.srt-d{color:var(--bl);background:color-mix(in srgb,var(--bl) 10%,var(--e))}.DT th.srt-a::after{content:" \25B2";font-size:7px}.DT th.srt-d::after{content:" \25BC";font-size:7px}
.DT.compact{font-size:10px}.DT.compact th{padding:6px 6px;font-size:8px;letter-spacing:.3px}.DT.compact td{padding:5px 6px;font-size:10px}.DT.compact .bg_{padding:1px 5px;font-size:8px}.DT.compact td.wrap{white-space:normal;line-height:1.25;max-width:140px;overflow-wrap:break-word}
/* Badges */
.bg_{display:inline-block;padding:2px 7px;border-radius:10px;font-size:9px;font-weight:600;font-family:'JetBrains Mono',monospace;white-space:nowrap}
.bg_g{background:#E8F5E9;color:#1B8C42}.bg_y{background:#FFF8E1;color:#E6A800}.bg_r{background:#FFEBEE;color:#C62828}.bg_b{background:#E3F2FD;color:#1565C0}.bg_p{background:#F3E5F5;color:#6A1B9A}.bg_x{background:var(--e);color:var(--tm)}.bg_o{background:#FFF3E0;color:#E65100}.bg_bl{background:#E3F2FD;color:#0D47A1}
.pbar{height:6px;background:var(--e);border-radius:3px;overflow:hidden}.pbar-f{height:100%;border-radius:3px}
/* Track bars */
/* Disc cards */
.disc-card{background:var(--c);border:1px solid var(--bd);border-radius:9px;padding:14px;border-top:3px solid var(--bl)}
.disc-card h4{font-size:11px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}

.disc-row .lbl{color:var(--tm);font-size:10px}.disc-row .val{font-family:'JetBrains Mono',monospace;font-weight:600}
/* Time badge */

.t-g{background:#E8F5E9;color:#1B8C42}.t-y{background:#FFF8E1;color:#E6A800}.t-r{background:#FFEBEE;color:#C62828}.t-x{background:var(--e);color:var(--tm)}
/* Help tooltip */
.hlp{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--bd);color:var(--tm);font-size:9px;font-weight:700;cursor:pointer;margin-left:4px;position:relative;vertical-align:middle;border:1px solid var(--b2);transition:all .2s;line-height:1;flex-shrink:0}.hlp:hover{background:var(--bl);color:#fff;border-color:var(--bl)}
.hlp-pop{display:none;position:fixed;z-index:999;background:#1A1D23;color:#E0E3EA;border-radius:10px;padding:14px 16px;font-size:11px;line-height:1.6;max-width:420px;min-width:260px;box-shadow:0 12px 40px rgba(0,0,0,.35);border:1px solid #333}
.hlp-pop.show{display:block;animation:hfi .15s ease-out}@keyframes hfi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.hlp-pop .hp-title{font-size:12px;font-weight:700;color:#fff;margin-bottom:6px}.hlp-pop .hp-close{position:absolute;top:8px;right:10px;cursor:pointer;color:#8B929E;font-size:14px;line-height:1}.hlp-pop .hp-close:hover{color:#fff}
.hp-col{color:#64B5F6;font-family:'JetBrains Mono',monospace;font-size:10px;background:rgba(100,181,246,.12);padding:1px 4px;border-radius:3px}
.hp-formula{background:#263238;padding:6px 10px;border-radius:6px;margin:6px 0;font-family:'JetBrains Mono',monospace;font-size:10px;color:#80CBC4;white-space:pre-wrap;line-height:1.5}
.hp-note{font-size:10px;color:#90A4AE;margin-top:4px;border-top:1px solid #333;padding-top:4px}
.btn-exp{background:var(--c);border:1px solid var(--bd);color:var(--td);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:10px;font-family:inherit}.btn-exp:hover{border-color:var(--r);color:var(--r)}
/* WAHA Modal */
.wm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:center;justify-content:center;animation:fi .2s}
.wm{background:var(--c);border-radius:14px;width:95%;max-width:680px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.wm-hdr{background:linear-gradient(135deg,#25D366,#128C7E);padding:16px 20px;border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:space-between}
.wm-hdr h2{color:#fff;font-size:15px;font-weight:700}.wm-close{color:#fff;font-size:20px;cursor:pointer;background:none;border:none;opacity:.7}.wm-close:hover{opacity:1}
.wm-body{padding:20px}.wm-section{margin-bottom:16px}.wm-section h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tm);margin-bottom:8px}
.wm-input{flex:1;background:var(--bg);border:1px solid var(--bd);color:var(--t);padding:8px 10px;border-radius:6px;font-family:inherit;font-size:12px;outline:none}.wm-input:focus{border-color:var(--bl)}
.wm-preview{background:#0B141A;border-radius:10px;padding:14px 16px;font-size:12px;line-height:1.7;color:#E9EDEF;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto;border:1px solid #1F2C33}
.wm-preview .wm-bubble{background:#005C4B;border-radius:0 8px 8px 8px;padding:8px 12px;display:inline-block;max-width:100%}
.wm-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:12px;border-top:1px solid var(--bd)}
.wm-btn{padding:8px 18px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;border:none;transition:all .2s}
.wm-btn-send{background:#25D366;color:#fff}.wm-btn-send:hover{background:#1DA851}.wm-btn-send:disabled{opacity:.5;cursor:not-allowed}
.wm-btn-copy{background:var(--bg);color:var(--t);border:1px solid var(--bd)}.wm-btn-copy:hover{border-color:var(--bl)}
.wm-btn-cancel{background:none;color:var(--td);border:1px solid var(--bd)}.wm-btn-cancel:hover{color:var(--r)}
.wm-status{font-size:11px;padding:6px 10px;border-radius:6px;margin-top:8px;display:none}
.wm-status.ok{display:block;background:#E8F5E9;color:#1B8C42}.wm-status.err{display:block;background:#FFEBEE;color:#C62828}.wm-status.sending{display:block;background:#E3F2FD;color:#1565C0}
.wm-chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.wm-chip{background:var(--bg);border:1px solid var(--bd);padding:4px 10px;border-radius:16px;font-size:10px;cursor:pointer;transition:all .2s}.wm-chip:hover,.wm-chip.sel{background:var(--bl);color:#fff;border-color:var(--bl)}
@media(max-width:768px){.hdr h1{font-size:12px}.D{padding:10px}.SS{grid-template-columns:repeat(3,1fr)}.DG{grid-template-columns:1fr 1fr}.hlp-pop{max-width:90vw}}
</style>

<script>
let DATA=[],FLT=[];const TODAY=new Date();TODAY.setHours(0,0,0,0);
const RM={'1':'Tarapacá','2':'Antofagasta','3':'Atacama','4':'Coquimbo','5':'Valparaíso','6':"O'Higgins",'7':'Maule','8':'Biobío','9':'Araucanía','10':'Los Lagos','11':'Aysén','12':'Magallanes','13':'Metropolitana','14':'Los Ríos','15':'Arica y Parinacota','16':'Ñuble','23':'Ñuble','25':'Arica','28':'Los Ríos','33':'Araucanía','43':'Los Lagos'};
function pD(v){if(!v)return null;if(v instanceof Date&&!isNaN(v))return v.getFullYear()<2000?null:v;const s=String(v);if(!s||s==='00:00:00'||s==='0'||s==='-'||s==='NA'||s==='NaN'||s==='None'||s==='PEND')return null;const d=new Date(s);return isNaN(d)||d.getFullYear()<2000?null:d}
function fD(d){return d?d.toISOString().split('T')[0]:'—'}
function dD(a,b){if(!a||!b)return null;let count=0;const d=new Date(a);if(isNaN(d))return null;let max=3000;while(d<b&&max-->0){const dow=d.getDay();if(dow!==0&&dow!==6)count++;d.setDate(d.getDate()+1)}return count}
function esc(v){return v==null?'':String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function isHW(r){return(r._contratista||'').includes('HUAWEI')}
function pct(n,t){return t?((n/t)*100).toFixed(1)+'%':'0%'}
function avg(arr){const f=arr.filter(v=>v!==null);return f.length?Math.round(f.reduce((a,b)=>a+b,0)/f.length):null}
function mx(arr){const f=arr.filter(v=>v!==null);return f.length?Math.max(...f):null}
function srtA(arr,col,dir){if(!col)return;arr.sort((a,b)=>{let va=a[col],vb=b[col];if(va==null)va='';if(vb==null)vb='';if(va instanceof Date&&vb instanceof Date)return(va-vb)*dir;if(typeof va==='number'&&typeof vb==='number')return(va-vb)*dir;if(typeof va==='boolean')return((va?1:0)-(vb?1:0))*dir;return String(va).localeCompare(String(vb),'es')*dir})}

// ═══ HELP SYSTEM ═══
const HELP={
s_total:{t:'Total Sitios',d:'Cuenta de filas con <span class="hp-col">ID_Sitio</span> ≠ vacío en hoja BASE.'},
s_fc:{t:'FC Aprobada',d:'<span class="hp-col">ESTADO FC</span> = "APROBADO".<br>Factibilidad Constructiva aprobada por operador de torre.'},
s_rfi:{t:'RFI Entregado',d:'<span class="hp-col">RFI ACTUAL</span> = "RFI".<br>Ready for Installation entregado al área de implementación.'},

function parseBase(rows,fname,sn){
let hi=-1;for(let i=0;i<20;i++){if(rows[i]&&rows[i].some(c=>String(c).trim()==='ID_Sitio')){hi=i;break}}
if(hi===-1){alert('No se encontraron encabezados');document.getElementById('lo').classList.add('hidden');return}
const hdr=rows[hi].map(h=>h?String(h).trim():'');
// Responsables from row above header
const r4=rows[hi-1]||[];window.RESP={};
['Fecha Apro RF','Fecha Apro ECE','Fecha Apro OOCC'].forEach(c=>{const i=hdr.indexOf(c);if(i>=0&&r4[i])RESP[c]=String(r4[i]).trim()});

DATA=[];
for(let i=hi+1;i<rows.length;i++){
  const row=rows[i];if(!row)continue;
  const o={};hdr.forEach((h,j)=>{if(h)o[h]=row[j]!=null?row[j]:null});
  if(!o['ID_Sitio'])continue;
  const g=k=>String(o[k]||'').trim();const gU=k=>g(k).toUpperCase();const gD=k=>pD(o[k]);
  // Basic
  o._id=g('ID_Sitio');o._nombre=g('Nombre');o._region=g('REGION');o._regionName=RM[o._region]||('R'+o._region);
  o._clasif=g('CLASIFICACIÓN').replace(/^\n/,'');o._tipoProyecto=g('TIPO DE PROYECTO')||'(vacío)';o._propietario=g('Propietario Estructura');o._contratista=g('CONTRATISTA')||'(vacío)';
  o._comentario2=g('COMENTARIO2')||g('COMENTARIO');o._comuna=g('COMUNA');
  o._plan=gU('PLAN');

  // ══ TSSR ══
  const prioRaw=g('N°Prio.')||g('N\u00b0Prio.')||g('Prioridad TSSR')||g('N°Prio')||'';
  o._prioTSSR=(prioRaw&&prioRaw!=='-')?prioRaw:'';
  o._isPrio=!!o._prioTSSR;
  o._ingTSSR=g('Ing. Asignado TSSR')||(g('Emisor TSSR')!=='-'?g('Emisor TSSR'):'');
  o._fechaEntPrio=gD('Fecha Entrega Prioridad')||gD('Fecha Emisión TSSR');
  o._fechaEnvEsp=gD('Fecha Envío a Especialidades');
  o._estatusIMPL=gU('EstatusIMPL');o._implApro=o._estatusIMPL.startsWith('APROBADO');
  o._fechaAproIMPL=gD('Fecha Apro IMPL');
  // Disciplines
  o._fechaSolRF=gD('Fecha solicitud Revisión RF');o._fechaAproRF=gD('Fecha Apro RF');o._estatusRF=g('EstatusRF');
  o._fechaSolECE=gD('Fecha solicitud Revisión ECE');o._fechaAproECE=gD('Fecha Apro ECE');o._estatusECE_d=g('Estatus ECE');
  o._fechaSolOOCC=gD('Fecha Solicitud Revisión OOCC');o._fechaAproOOCC=gD('Fecha Apro OOCC');o._estatusOOCC=g('Estatus OOCC');
  o._estatusTSSR=g('ESTATUS TSSR');
  // Disc computed
  o._rfRech=gU('EstatusRF').includes('RECHAZ');o._eceRech=gU('Estatus ECE').includes('RECHAZ');o._ooccRech=gU('Estatus OOCC').includes('RECHAZ');
  o._rfOK=(!!o._fechaAproRF||gU('EstatusRF').startsWith('APROBADO'))&&!o._rfRech;
  o._eceRevOK=(!!o._fechaAproECE||gU('Estatus ECE').startsWith('APROBADO'))&&!o._eceRech;
  o._ooccOK=(!!o._fechaAproOOCC||gU('Estatus OOCC').startsWith('APROBADO'))&&!o._ooccRech;
  o._rfPend=!!o._fechaSolRF&&!o._rfOK&&!o._rfRech;o._ecePendD=!!o._fechaSolECE&&!o._eceRevOK&&!o._eceRech;o._ooccPend=!!o._fechaSolOOCC&&!o._ooccOK&&!o._ooccRech;
  o._anyDiscSent=!!(o._fechaEnvEsp||o._fechaSolRF||o._fechaSolECE||o._fechaSolOOCC);
  o._allDiscOK=o._implApro&&o._rfOK&&o._eceRevOK&&o._ooccOK;
  o._anyRech=o._rfRech||o._eceRech||o._ooccRech;
  o._discOKCount=[o._implApro,o._rfOK,o._eceRevOK,o._ooccOK].filter(Boolean).length;
  // TSSR: use official ESTATUS TSSR column (consistent across all tabs)
  // Aprobado = ESTATUS TSSR is APROBADO or APROBADO CON OBS
  // Rechazado = ESTATUS TSSR RECHAZADO OR any discipline rechazada
  // Pendiente = the rest (sin estatus, en revisión, requiere visita, visitado)
  o._tssrAprobado=gU('ESTATUS TSSR').startsWith('APROBADO');
  o._tssrRechazado=gU('ESTATUS TSSR').includes('RECHAZ')||o._rfRech||o._eceRech||o._ooccRech;
  o._tssrPend=!o._tssrAprobado&&!o._tssrRechazado;
  o._tssrEnRev=gU('ESTATUS TSSR').includes('REVISI');

  // Sort helpers (precomputed)
  o._rfSort=o._rfOK?2:o._rfRech?-1:o._rfPend?1:0;
  o._eceSort=o._eceRevOK?2:o._eceRech?-1:o._ecePendD?1:0;
  o._ooccSort=o._ooccOK?2:o._ooccRech?-1:o._ooccPend?1:0;
  o._tssrSort=o._tssrAprobado?2:o._tssrRechazado?-1:0;

  // ══ FC ══
  o._fcRaw=g('ESTADO FC');
  o._fcAprobado=gU('ESTADO FC')==='APROBADO';
  o._fcLVES=gU('ESTADO FC').includes('LEVANTAMIENTO');
  o._fcRev=gU('ESTADO FC').includes('REVISIÓN');
  o._fcPend=gU('ESTADO FC').includes('PENDIENTE');
  o._fcReqTSSR=gU('ESTADO FC').includes('REQUIERE');
  o._fcNoFactible=gU('ESTADO FC')==='NO FACTIBLE';
  o._fcAproRenta=gU('ESTADO FC').includes('APROBACI')&&gU('ESTADO FC').includes('RENTA');
  o._fcNoAplica=gU('ESTADO FC')==='NO APLICA';
  o._fcRefuerzo=gU('ESTADO FC').includes('REFUERZO');
  o._fcSinGestion=!o._fcAprobado&&!o._fcLVES&&!o._fcRev&&!o._fcReqTSSR&&!o._fcNoFactible&&!o._fcAproRenta&&!o._fcNoAplica&&!o._fcRefuerzo;
  o._fcStatusSort=o._fcAprobado?4:o._fcLVES?3:o._fcRev?2:o._fcReqTSSR?1:0;
  o._fcStatus=o._fcAprobado?'Aprobado':o._fcLVES?'Lev. Estructural':o._fcRev?'Rev. Operador':o._fcReqTSSR?'Req. TSSR':o._fcNoFactible?'No Factible':o._fcAproRenta?'F. Apro. Renta':o._fcNoAplica?'No Aplica':o._fcRefuerzo?'Refuerzo':'Sin Gestión';
  o._fechaSolFC=gD('FECHA DE SOLICITUD FC');o._fechaRespFC=gD('FECHA DE RESPUESTA FC');

  // ══ ECE ══
  o._ece=g('ECE');

  // ══ RFI ══
  o._rfiActual=gU('RFI ACTUAL');o._rfiOK=o._rfiActual==='RFI';o._rfiPend=o._rfiActual.startsWith('PEND');
  o._fechaRFI=gD('FECHA RFI');

  // ══ IMPLEMENTACIÓN ══
  o._estatusImplFinal=g('ESTATUS IMPLE.');
  o._fechaPlanImpl=gD('FECHA PLAN IMPL');o._fechaRealImpl=gD('FECHA REAL IMP');o._fechaINT=gD('FECHA INT');
  o._estatusINT=g('ESTATUS INT');
  o._onAir=gU('ESTATUS INT')==='ON AIR';

  // ══ ASBUILT ══
  o._asbRecepcion=gD('Recepcion de Asbuilt');
  o._asbEnvEsp=gD('Envío Asbuilt a Especialidades');
  o._asbFechaImpl=gD('Fecha Rev. Impl. Asb');o._asbEstatusImpl=gU('Estatus Asb Impl');
  o._asbFechaRF=gD('Fecha Rev. RF. Asb');o._asbEstatusRF=gU('Estatus Asb RF');
  o._asbFechaECE=gD('Fecha Rev. ECE Asb');o._asbEstatusECE=gU('Estatus Asb ECE');
  o._asbFechaOOCC=gD('Fecha Rev. OOCC Asb');o._asbEstatusOOCC=gU('Estatus Asb OOCC');
  o._asbObsOOCC=g('OBS ASB OOCC');
  o._asbEstatus=gU('ESTATUS ASBUILT');
  o._asbImplOK=o._asbEstatusImpl.startsWith('APROBADO');
  o._asbRFOK=o._asbEstatusRF.startsWith('APROBADO');
  o._asbECEOK=o._asbEstatusECE.startsWith('APROBADO');
  o._asbOOCCOK=o._asbEstatusOOCC.startsWith('APROBADO');
  o._asbImplPend=o._asbEstatusImpl.includes('PENDIENTE');
  o._asbRFPend=o._asbEstatusRF.includes('PENDIENTE');
  o._asbECEPend=o._asbEstatusECE.includes('PENDIENTE');
  o._asbOOCCPend=o._asbEstatusOOCC.includes('PENDIENTE');
  o._asbImplRech=o._asbEstatusImpl.includes('RECHAZ');
  o._asbRFRech=o._asbEstatusRF.includes('RECHAZ');
  o._asbECERech=o._asbEstatusECE.includes('RECHAZ');
  o._asbOOCCRech=o._asbEstatusOOCC.includes('RECHAZ');
  o._asbScope=!!(o._asbRecepcion||o._asbEnvEsp);
  o._asbDiscOK=(o._asbImplOK?1:0)+(o._asbRFOK?1:0)+(o._asbECEOK?1:0)+(o._asbOOCCOK?1:0);
  o._asbAprobado=o._asbEstatus==='APROBADO'||o._asbDiscOK===4;
  o._asbEnRevision=o._asbEstatus.includes('REVISION');

  // ══ TIEMPOS ══
  o._t_prioToApro=dD(o._fechaEntPrio,o._fechaAproIMPL);
  o._t_aproToEnv=dD(o._fechaAproIMPL,o._fechaEnvEsp);
  o._t_rfWait=o._rfPend?dD(o._fechaSolRF,TODAY):o._rfOK?dD(o._fechaSolRF,o._fechaAproRF):null;
  o._t_eceWait=o._ecePendD?dD(o._fechaSolECE,TODAY):o._eceRevOK?dD(o._fechaSolECE,o._fechaAproECE):null;
  o._t_ooccWait=o._ooccPend?dD(o._fechaSolOOCC,TODAY):o._ooccOK?dD(o._fechaSolOOCC,o._fechaAproOOCC):null;
  o._t_fcSolResp=dD(o._fechaSolFC,o._fechaRespFC);

  // ══ PIPELINE ══
  if(o._onAir){o._stage='On Air';o._stageN=9;o._stageColor='#2E7D32'}
  else if(o._fcAprobado&&o._tssrAprobado&&o._rfiOK){o._stage='Listo Impl';o._stageN=7;o._stageColor='#0D47A1'}
  else if(o._rfiOK){o._stage='RFI Entregado';o._stageN=6;o._stageColor='#00838F'}
  else if(o._allDiscOK){o._stage='Disc. Aprobadas';o._stageN=5;o._stageColor='#0D47A1'}
  else if(o._tssrAprobado){o._stage='TSSR Aprobado';o._stageN=4;o._stageColor='#2E7D32'}
  else if(o._anyDiscSent){o._stage='En Rev. Disciplinas';o._stageN=3;o._stageColor='#F57F17'}
  else if(o._implApro){o._stage='TSSR Apro Interno';o._stageN=2;o._stageColor='#6A1B9A'}
  else if(o._isPrio){o._stage='Priorizado';o._stageN=1;o._stageColor='#E65100'}
  else{o._stage='Sin Priorizar';o._stageN=0;o._stageColor='#8B929E'}

  // Estado global (para filtro)
  if(o._onAir)o._estadoGlobal='On Air';
  else if(o._anyRech||o._tssrRechazado||o._fcNoFactible)o._estadoGlobal='Rechazado / No viable';
  else if(o._rfiOK)o._estadoGlobal='RFI disponible';
  else if(o._fcAprobado&&o._tssrAprobado)o._estadoGlobal='Listo para RFI';
  else if(o._fcAprobado||o._anyDiscSent||o._tssrEnRev)o._estadoGlobal='En revisi\u00f3n';
  else if(o._fcPend||o._fcReqTSSR||o._fcLVES||o._fcRev)o._estadoGlobal='Bloqueado / Dependencia';
  else o._estadoGlobal='Sin gesti\u00f3n';

  DATA.push(o);
}
document.getElementById('fInfo').textContent=`${fname} — ${sn}: ${DATA.length} sitios`;
document.getElementById('btnN').style.display='';document.getElementById('btnWaha').style.display='';
popFilters();applyF();
document.getElementById('uz').style.display='none';document.getElementById('D').style.display='block';
document.getElementById('lo').classList.add('hidden');
syncToVPS(fname);
setTimeout(()=>syncToPB(fname),500);

const _ms={};
function initMS(id,opts,al){al=al||'Todos';_ms[id]={opts,sel:new Set(),al};document.getElementById(id).innerHTML=`<div class="ms-btn" onclick="tgMS('${id}')">${al}</div><div class="ms-dd" id="${id}_dd"></div>`;rMS(id)}
function rMS(id){
  const s=_ms[id];if(!s)return;
  const filter=(s.searchTerm||'').toLowerCase();
  const counts=s.counts||new Map();
  const enabled=s.opts.filter(v=>(counts.get(v)||0)>0 || s.sel.has(v));
  const allSel=enabled.length>0&&enabled.every(v=>s.sel.has(v));
  const hasSel=s.sel.size>0&&!allSel;
  const totalOpts=s.totalOpts||s.opts.length;
  const filteredOpts=filter?s.opts.filter(v=>String(v).toLowerCase().includes(filter)):s.opts;
  document.getElementById(id+'_dd').innerHTML=
    (s.opts.length>8?`<input type="text" class="ms-search" placeholder="\ud83d\udd0d Buscar..." oninput="_msSearch('${id}',this.value)" onclick="event.stopPropagation()" value="${s.searchTerm||''}"/>`:'')+
    (totalOpts?`<div class="ms-hint">Opciones visibles \u00b7 valores sin datos quedan en gris</div>`:'')+
    `<div class="ms-opt${allSel?' sel':''}" onclick="event.stopPropagation();tgAll('${id}')"><span class="ck">${allSel?'\u2713':''}</span><span style="font-weight:600">Seleccionar todo disponible</span><span class="cnt">${enabled.length}</span></div>`+
    filteredOpts.map((v,i)=>{const cnt=counts.has(v)?counts.get(v):0;const dis=cnt===0&&!s.sel.has(v);return`<div class="ms-opt${s.sel.has(v)?' sel':''}${dis?' dis':''}" onclick="event.stopPropagation();tgO('${id}',${s.opts.indexOf(v)})"><span class="ck">${s.sel.has(v)?'\u2713':''}</span><span>${esc(v)}</span><span class="cnt">${cnt}</span></div>`}).join('')+
    (filteredOpts.length===0?`<div style="padding:8px;font-size:10px;color:var(--tm);text-align:center">Sin resultados</div>`:'')+
    ((hasSel||allSel)?`<div class="ms-clear" onclick="event.stopPropagation();clearMS('${id}')">\u2715 Limpiar selecci\u00f3n</div>`:'');
  const b=document.getElementById(id+'_dd').previousElementSibling;
  b.classList.toggle('active',hasSel||allSel);
  if(hasSel||allSel){
    b.innerHTML=`<span style="overflow:hidden;text-overflow:ellipsis">${s.sel.size===1?esc([...s.sel][0]):s.sel.size+' seleccionados'}</span><span class="ms-cnt">${s.sel.size}</span>`;
  }else{
    b.innerHTML=`<span>${s.al}</span>`;
  }
}
function _msSearch(id,val){if(_ms[id]){_ms[id].searchTerm=val;rMS(id);const i=document.querySelector('#'+id+'_dd .ms-search');if(i){i.focus();i.setSelectionRange(val.length,val.length)}}}
function clearMS(id){if(_ms[id]){_ms[id].sel.clear();rMS(id);applyF()}}

const FIELD_MAP={fReg:'_regionName',fCont:'_contratista',fTipo:'_tipoProyecto',fPlan:'_plan',fEstado:'_estadoGlobal',fClasif:'_clasif',fPrio:'_prioTSSR',fProp:'_propietario'};

function cleanOpt(v){return v!=null&&String(v).trim()!==''&&String(v).trim()!=='-'&&String(v).trim()!=='0'&&String(v).trim().toUpperCase()!=='N/A'}
function sortOpts(a,b){
  const sa=String(a),sb=String(b);
  if(sa==='Sin prioridad')return 1;if(sb==='Sin prioridad')return -1;
  return sa.localeCompare(sb,'es',{numeric:true,sensitivity:'base'});
}

function popFilters(){
  // Inicializa con universo completo; refreshAvailable() solo deshabilita opciones sin datos
  Object.entries(FIELD_MAP).forEach(([id,field])=>{
    const opts=[...new Set(DATA.map(r=>r[field]).filter(cleanOpt))].sort(sortOpts);
    initMS(id,opts);
    _ms[id].totalOpts=opts.length;
    _ms[id].allOpts=[...opts];
  });
}

// Recalcula conteos disponibles para cada opci\u00f3n seg\u00fan TODOS LOS OTROS filtros activos
function refreshAvailable(){
  Object.entries(FIELD_MAP).forEach(([id,field])=>{
    if(!_ms[id])return;
    const counts=new Map();
    (_ms[id].allOpts||_ms[id].opts).forEach(v=>counts.set(v,0));
    DATA.forEach(r=>{
      for(const[oid,ofield]of Object.entries(FIELD_MAP)){
        if(oid===id)continue;
        const sel=_ms[oid]?_ms[oid].sel:null;
        if(sel&&sel.size&&!sel.has(r[ofield]))return;
      }
      const val=r[field];
      if(cleanOpt(val))counts.set(val,(counts.get(val)||0)+1);
    });
    _ms[id].counts=counts;
    _ms[id].opts=[...(_ms[id].allOpts||_ms[id].opts)];
    rMS(id);
  });
}

function rowMatchesSearch(r,s){
  if(!s)return true;
  const searchable=[r._id,r._nombre,r._regionName,r._comuna,r._contratista,r._propietario,r._clasif,r._tipoProyecto,r._plan,r._estadoGlobal,r._prioTSSR,r._comentario2,r._fcRaw,r._estatusTSSR,r._rfiActual,r._estatusImplFinal,r._estatusINT]
    .map(v=>v==null?'':String(v)).join('|').toLowerCase();
  return searchable.includes(s);
}

function applyF(){
  refreshAvailable();
  const f={reg:gV('fReg'),cont:gV('fCont'),tipo:gV('fTipo'),plan:gV('fPlan'),estado:gV('fEstado'),clasif:gV('fClasif'),prio:gV('fPrio'),prop:gV('fProp')};

    if(f.tipo.size&&!f.tipo.has(r._tipoProyecto))return false;
    if(f.plan.size&&!f.plan.has(r._plan))return false;
    if(f.estado.size&&!f.estado.has(r._estadoGlobal))return false;

    if(f.prop.size&&!f.prop.has(r._propietario))return false;

    return true;
  });
  renderAll();
}

function isoMonday(year,week){
  const jan4=new Date(year,0,4);
  const d=new Date(jan4.getTime());
  d.setDate(jan4.getDate()-(jan4.getDay()||7)+1+(week-1)*7);
  d.setHours(0,0,0,0);
  return d;
}

  }
  return null; // future
});

function getISOWeek(dt){
  const d=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));
  d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));
  const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));

}

function _veRender(){
  const search=(document.getElementById('veSearch')?.value||'').toLowerCase();
  window._veSearch=search;
  const all=window._veSitesAll||[];
  let rows=all;
  if(search){
    rows=rows.filter(r=>(r._id||'').toLowerCase().includes(search)||(r._nombre||'').toLowerCase().includes(search)||(r['COMUNA']||'').toLowerCase().includes(search)||(r._contratista||'').toLowerCase().includes(search)||(r._regionName||'').toLowerCase().includes(search)||(r._clasif||'').toLowerCase().includes(search)||(r._prioTSSR||'').toLowerCase().includes(search));
  }
  const sortCol=window._veSortCol,sortDir=window._veSortDir;
  if(sortCol){
    const col=_VE_COLS.find(c=>c.k===sortCol);
    if(col){
      rows=[...rows].sort((a,b)=>{
        const va=col.v(a),vb=col.v(b);
        if(va==null&&vb==null)return 0;
        if(va==null)return 1;
        if(vb==null)return -1;
        if(typeof va==='number'&&typeof vb==='number')return(va-vb)*sortDir;
        return String(va).localeCompare(String(vb))*sortDir;
      });
    }
  }
  window._veSitesFiltered=rows;
  // Header with sort indicators
  const head=document.getElementById('veHead');
  if(head){
    head.innerHTML=_VE_COLS.map(c=>{
      const isSort=sortCol===c.k;
      const indicator=isSort?(sortDir===1?' \u25b2':' \u25bc'):'';
      return`<th onclick="_veSort('${c.k}')" style="cursor:pointer;user-select:none;white-space:nowrap;${isSort?'background:#FFE0B2;color:#E65100':''}" title="Click para ordenar">${c.l}${indicator}</th>`;
    }).join('');
  }
  // Body
  const body=document.getElementById('veBody');
  if(body){
    body.innerHTML=rows.length
      ?rows.map(r=>`<tr>${_VE_COLS.map(c=>c.r(r)).join('')}</tr>`).join('')
      :`<tr><td colspan="${_VE_COLS.length}" style="text-align:center;padding:40px;color:var(--tm)">${search?'Sin resultados para "'+esc(search)+'"':'No hay sitios en esta categor\u00eda'}</td></tr>`;
  }
  // Count
  const cnt=document.getElementById('veCnt');
  if(cnt)cnt.textContent=rows.length;
}

function _veSort(col){
  if(window._veSortCol===col){window._veSortDir*=-1}
  else{window._veSortCol=col;window._veSortDir=-1} // Default: desc (mayor a menor)
  _veRender();
}

function rTSSR(){
const d=FLT,t=d.length;let h='';
const tssrScope=d.filter(r=>r._fechaEnvEsp||r._anyDiscSent);

// Initialize filter sets
window._tssrFSt=window._tssrFSt||new Set();
window._tssrFArea=window._tssrFArea||new Set();

const eU=r=>(r._estatusTSSR||'').toUpperCase();
const tssrStKey=r=>{const e=eU(r);if(r._rfRech||r._eceRech||r._ooccRech||e.includes('RECHAZ'))return'RECHAZADO';if(e==='APROBADO')return'APROBADO';if(e==='APROBADO CON OBS')return'APROBADO_OBS';if(e.includes('REVISI'))return'EN_REVISION';if(e.includes('REQUIERE')||e==='VISITADO')return'REQ_VISITA';return'SIN_ESTATUS'};
const discPend=(r,a)=>(a==='IMPL'&&!r._implApro)||(a==='RF'&&!r._rfOK)||(a==='ECE'&&!r._eceRevOK)||(a==='OOCC'&&!r._ooccOK);

// For each card row, count over the data filtered by the OTHER row's selections
// Status cards: count on d filtered by active disciplines
const dForStatus=window._tssrFArea.size?d.filter(r=>{for(const a of window._tssrFArea)if(discPend(r,a))return true;return false}):d;
const tssrApro=dForStatus.filter(r=>tssrStKey(r)==='APROBADO').length;
const tssrAproObs=dForStatus.filter(r=>tssrStKey(r)==='APROBADO_OBS').length;
const tssrEnRev=dForStatus.filter(r=>tssrStKey(r)==='EN_REVISION').length;
const tssrReqVis=dForStatus.filter(r=>tssrStKey(r)==='REQ_VISITA').length;
const tssrRech=dForStatus.filter(r=>tssrStKey(r)==='RECHAZADO').length;
const tssrSin=dForStatus.filter(r=>tssrStKey(r)==='SIN_ESTATUS').length;
const tStatus=dForStatus.length;

// Discipline cards: count on tssrScope filtered by active statuses
const scopeForDisc=window._tssrFSt.size?tssrScope.filter(r=>window._tssrFSt.has(tssrStKey(r))):tssrScope;

const isActive=k=>window._tssrFSt.has(k);
const mkTssrCard=(label,count,color,key,hk)=>{
  const sel=isActive(key);
  return `<div class="DC" style="position:relative;border-left-color:${color};cursor:pointer;${sel?'box-shadow:0 0 0 2px '+color+';transform:translateY(-2px);background:color-mix(in srgb,'+color+' 9%,var(--c));':''}transition:all .2s" onclick="tgTssrCard('${key}',this)">
${sel?'<div style="position:absolute;top:6px;right:8px;background:'+color+';color:#fff;font-size:8px;font-weight:700;padding:2px 7px;border-radius:8px;letter-spacing:.5px;line-height:1.4">\u2713 FILTRO</div>':''}
<div class="dn">${label}${hk?' '+hlp(hk):''}</div>
<div class="dr"><span style="font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:${color}">${count}</span><span style="color:var(--tm)">${pct(count,tStatus)}</span></div>
<div class="db"><div class="dbs" style="width:${tStatus?count/tStatus*100:0}%;background:${color}"></div></div>
</div>`;
};

function filterPrio(arr){
const fcF=window._prioFcF,tssrF=window._prioTssrF,implF=window._prioImplF,numF=window._prioNumF;
return arr.filter(r=>{
  if(fcF.size){
    const k=r._fcAprobado?'APROBADO':r._fcLVES?'LVES':r._fcRev?'REV':r._fcReqTSSR?'REQTSSR':'SIN';
    if(!fcF.has(k))return!1;
  }
  if(tssrF.size){
    const eu=(r._estatusTSSR||'').toUpperCase();
    let k='PEND';
    if(eu.includes('RECHAZ'))k='RECHAZ';
    else if(eu.startsWith('APROBADO'))k='APROBADO';
    else if(eu.includes('REVISI'))k='REVISION';
    if(!tssrF.has(k))return!1;
  }
  if(implF.size){
    let k='SIN';
    if(r._onAir)k='ONAIR';
    else if(r._rfiOK)k='RFI';
    else if(r._rfiPend||r._estatusINT)k='PEND';
    if(!implF.has(k))return!1;
  }
  if(numF.size){
    const k=r._prioTSSR||'_SIN_';
    if(!numF.has(k))return!1;
  }
  return!0;
});
}

// === Generic Excel writer ===
function _writeXLSX(rows,colWidths,sheetName,fileName){
  const ws=XLSX.utils.aoa_to_sheet(rows);
  if(colWidths)ws['!cols']=colWidths.map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,sheetName||'Data');
  XLSX.writeFile(wb,fileName||('Export_'+new Date().toISOString().split('T')[0]+'.xlsx'));
}

// ═══ POCKETBASE SYNC ═══
async function syncToPB(fname){
  if(!hasPB())return;
  const pb=document.getElementById('syncBadge');
  try{
    pb.textContent='🔄 Sync PB…';pb.style.background='rgba(106,27,154,.4)';
    // Auth
    const auth=await fetch(PB.url+'/api/collections/_superusers/auth-with-password',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({identity:PB.email,password:PB.pass})
    });
    const tk=(await auth.json()).token;
    const H={'Authorization':'Bearer '+tk,'Content-Type':'application/json'};

    // Fetch existing
    let existing={},pg=1;
    while(true){
      const r=await fetch(PB.url+'/api/collections/e5g_sitios/records?perPage=200&page='+pg,{headers:H});
      const d=await r.json();
      (d.items||[]).forEach(rec=>{existing[rec.id_sitio]=rec});
      if(Object.keys(existing).length>=d.totalItems)break;
      pg++;
    }

    const RM={'1':'Tarapacá','2':'Antofagasta','3':'Atacama','4':'Coquimbo','5':'Valparaíso',
      '6':"O'Higgins",'7':'Maule','8':'Biobío','9':'Araucanía','10':'Los Lagos',
      '11':'Aysén','12':'Magallanes','13':'Metropolitana','14':'Los Ríos',
      '15':'Arica y Parinacota','16':'Ñuble'};
    function pbDate(v){if(!v||!(v instanceof Date)||isNaN(v)||v.getFullYear()<2000)return '';return v.toISOString().slice(0,10)+' 12:00:00.000Z'}
    function pbStr(v){const s=String(v||'').trim();return(s==='-'||s==='00:00:00'||s==='NaN'||s==='None')?'':s}

    // Map DATA[] to PB records
    const dateFields=new Set(['fc_fecha_solicitud','fc_fecha_respuesta','tssr_fecha_envio_esp',
      'impl_fecha_apro','rf_fecha_sol','rf_fecha_apro','ece_fecha_sol','ece_fecha_apro',
      'oocc_fecha_sol','oocc_fecha_apro','rfi_fecha','impl_fecha_plan','impl_fecha_real','fecha_int']);
    const trackFields=['contratista','propietario','clasificacion','comuna','nombre','region','comentario',
      'fc_estado','tssr_estatus','impl_estatus','rf_estatus','ece_estatus',
      'oocc_estatus','rfi_estado','impl_final_estatus','estatus_int',
      'tssr_fecha_envio_esp','impl_fecha_apro','rf_fecha_sol','rf_fecha_apro',
      'ece_fecha_sol','ece_fecha_apro','oocc_fecha_sol','oocc_fecha_apro',
      'fc_fecha_solicitud','fc_fecha_respuesta','rfi_fecha','impl_fecha_plan',
      'impl_fecha_real','fecha_int','tssr_ingeniero','tssr_prioridad'];

    function buildRec(r){
      const reg=r._region||'';
      return{
        id_sitio:r._id,nombre:r._nombre,
        region:RM[reg]||(reg.length>3?reg:'R'+reg),
        comuna:pbStr(r['COMUNA']),clasificacion:pbStr(r._clasif),
        propietario:pbStr(r._propietario),contratista:pbStr(r._contratista),
        lat:parseFloat(r['LATITUD'])||0,lon:parseFloat(r['LONGITUD'])||0,
        fc_estado:pbStr(r._fcRaw),
        fc_fecha_solicitud:pbDate(r._fechaSolFC),fc_fecha_respuesta:pbDate(r._fechaRespFC),
        tssr_prioridad:pbStr(r._prioTSSR),tssr_ingeniero:pbStr(r._ingTSSR),
        tssr_fecha_envio_esp:pbDate(r._fechaEnvEsp),tssr_estatus:pbStr(r._estatusTSSR),
        impl_estatus:pbStr(r._estatusIMPL),impl_fecha_apro:pbDate(r._fechaAproIMPL),
        rf_estatus:pbStr(r._estatusRF),rf_fecha_sol:pbDate(r._fechaSolRF),rf_fecha_apro:pbDate(r._fechaAproRF),
        ece_estatus:pbStr(r._estatusECE_d),ece_fecha_sol:pbDate(r._fechaSolECE),ece_fecha_apro:pbDate(r._fechaAproECE),
        oocc_estatus:pbStr(r._estatusOOCC),oocc_fecha_sol:pbDate(r._fechaSolOOCC),oocc_fecha_apro:pbDate(r._fechaAproOOCC),
        rfi_estado:pbStr(r._rfiActual),rfi_fecha:pbDate(r._fechaRFI),
        impl_final_estatus:pbStr(r._estatusImplFinal),
        impl_fecha_plan:pbDate(r._fechaPlanImpl),impl_fecha_real:pbDate(r._fechaRealImpl),
        estatus_int:pbStr(r._estatusINT),fecha_int:pbDate(r._fechaINT),
        comentario:pbStr(r._comentario2),activo:true
      }
    }

    let created=0,updated=0,changes=[];
    // Build all operations
    const ops=[];
    for(const r of DATA){
      const rec=buildRec(r);
      const ex=existing[r._id];
      if(!ex){
        ops.push({type:'create',rec});
      }else{
        const diff={};
        trackFields.forEach(f=>{
          const nv=(rec[f]||'').replace(' 12:00:00.000Z','');
          const ov=(ex[f]||'').replace(' 12:00:00.000Z','').replace('T00:00:00','').slice(0,10);
          if(nv!==ov){
            diff[f]=rec[f];
            changes.push({sitio:ex.id,id_sitio:r._id,campo:f,valor_anterior:ex[f]||'',valor_nuevo:rec[f]||'',usuario:'Excel: '+fname});
          }
        });
        if(Object.keys(diff).length){ops.push({type:'update',id:ex.id,diff})}
      }
    }

    // Execute in parallel batches of 10
    pb.textContent=`🔄 Sync PB ${ops.length}…`;
    const BATCH=10;
    for(let i=0;i<ops.length;i+=BATCH){
      const batch=ops.slice(i,i+BATCH);
      await Promise.all(batch.map(op=>{
        if(op.type==='create'){
          return fetch(PB.url+'/api/collections/e5g_sitios/records',{method:'POST',headers:H,body:JSON.stringify(op.rec)}).then(()=>created++);
        }else{
          return fetch(PB.url+'/api/collections/e5g_sitios/records/'+op.id,{method:'PATCH',headers:H,body:JSON.stringify(op.diff)}).then(()=>updated++);
        }
      }));
      if(i%50===0){pb.textContent=`🔄 Sync PB ${i}/${ops.length}…`}
    }

    // Log changes in parallel batches
    pb.textContent=`📝 Log ${changes.length}…`;
    for(let i=0;i<changes.length;i+=BATCH){
      const batch=changes.slice(i,i+BATCH);
      await Promise.all(batch.map(ch=>
        fetch(PB.url+'/api/collections/e5g_historial/records',{method:'POST',headers:H,body:JSON.stringify(ch)})
      ));
    }

    pb.textContent=`☁️ PB: ${created}↑ ${updated}✎ ${changes.length}Δ`;
    pb.style.background='rgba(46,125,50,.4)';
    console.log(`✅ PB sync: ${created} nuevos, ${updated} actualizados, ${changes.length} cambios`);
  }catch(e){
    console.error('PB sync error:',e);
    pb.textContent='⚠️ PB error';
    pb.style.background='rgba(198,40,40,.3)';
  }
}
